:root{--p:#047a40;--a:#05bb62;--bg:#f3f5f2;--c:#fff;--t:#1b261f;--m:#667569;--b:#dde4de;--r:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111812;--c:#1b261e;--t:#e9f0ea;--m:#9aa99e;--b:#2c3a2f;color-scheme:dark}header{background:var(--c)}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 "Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif}
button,input,select{font:inherit;color:inherit}
header{background:#fff;color:var(--p);border-bottom:3px solid #05bb62;display:flex;align-items:center;gap:10px;padding:6px 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.lg{width:42px;height:auto}header b{font-size:18px;flex:1}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;background:var(--c);border-bottom:1px solid var(--b)}
nav button{white-space:nowrap;border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--m)}nav button.on{background:var(--p);color:#fff}
main{padding:12px;max-width:1200px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;color:var(--p)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
input,select{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px 10px;min-width:0}
.btn{background:var(--p);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}.btn.a{background:var(--a);color:#022b16;font-weight:700}.btn.r{background:var(--r)}.btn.o{background:none;color:var(--p);border:1px solid var(--p)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--b);text-align:right;white-space:nowrap}th{color:var(--m);font-weight:600}
.big{font-size:26px;font-weight:800;color:var(--p)}.k{color:var(--m);font-size:13px}.bar{height:10px;background:var(--a);border-radius:5px}
.tot{background:var(--p);color:#fff;border-radius:10px;padding:12px;text-align:center;margin-bottom:12px}.tot .big{color:#fff;font-size:34px}
#md{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:20;padding:12px}#md>div{background:var(--c);border-radius:12px;padding:14px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
#lg{max-width:340px;margin:10vh auto 0;text-align:center}#ft{text-align:center;font-size:11px;color:var(--m);padding:14px}
#rcp{font-size:12px;color:#000}#rcp table td,#rcp table th{padding:2px;border:0;color:#000}
@page{size:80mm auto;margin:2mm}
@media print{body>*:not(#md){display:none!important}#md{position:static;background:none;display:block!important;padding:0}#md>div{background:#fff;max-width:none;padding:0;overflow:visible}.np{display:none!important}#rcp{width:76mm}}

 const r={no:db.rinv.length+1,sup:Q.sup.trim(),br:Q.br,d:today(),tm:now(),t:Q.l.reduce((s,l)=>s+l.q*l.c,0),l:Q.l.map(l=>({b:l.p.bc,n:l.p.name,q:l.q,c:l.c}))};
